events {
    worker_connections 1024;
}

http {
    upstream identity_profile_service {
        server identity-profile-service:8000;
    }

    upstream session_service {
        server session-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    server {
        listen 80;

        # Generate a request ID if not present
        add_header X-Request-ID $request_id always;

        location /api/v1/auth/ {
            proxy_pass http://identity_profile_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/mfa/ {
            proxy_pass http://identity_profile_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/profiles/ {
            proxy_pass http://identity_profile_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/sessions/ {
            proxy_pass http://session_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/notifications/ {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
