name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config

  build-services:
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build identity service image
        run: docker build -t skillswap-identity-profile-service ./identity-profile-service

      - name: Build session service image
        run: docker build -t skillswap-session-service ./session-service

      - name: Build notification service image
        run: docker build -t skillswap-notification-service ./notification-service
